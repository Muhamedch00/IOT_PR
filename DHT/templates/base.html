{% load static %}
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard IoT Futuriste{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=3">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    {% block extra_head %}{% endblock %}
</head>

<body>
    <header class="main-header">

        <div class="user-menu">
            {% if user.is_authenticated %}
            <div class="user-dropdown">
                <button class="user-btn">
                    👤 {{ user.username }}
                    <span class="role-badge">{{ role|default:"Utilisateur" }}</span>
                    <span class="arrow">▼</span>
                </button>
                <div class="dropdown-content">
                    <a href="{% url 'logout' %}" class="logout-link">🔴 Déconnexion</a>
                </div>
            </div>
            {% else %}
            <a href="{% url 'login' %}" class="login-btn">Connexion</a>
            {% endif %}
        </div>
    </header>

    {% block content %}{% endblock %}

    {% block extra_scripts %}{% endblock %}
</body>

</html>
